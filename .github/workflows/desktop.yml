name: Desktop build

# The demo for Steam as a desktop app (electron/, npm run pack:demo), on each system for its own: what to try out or to
# upload to Steam is this run's artifacts «disco-underground-demo-windows» (the folder), «-linux» (a .tar.gz, for Linux
# and the Steam Deck) and «-mac» (a .zip of the app, for a Mac with either chip). Linux's and the Mac's are packed once
# more because an artifact's own zip loses which files may run and the Mac app's links.

on:
  push:
    branches: [main]
  pull_request:
    paths: ['electron/**', 'src/net/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, out: release/win-unpacked }
          - { name: linux, os: ubuntu-latest, out: release/disco-underground-demo-linux.tar.gz }
          - { name: mac, os: macos-latest, out: release/disco-underground-demo-mac.zip }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version's build number counts commits (vite.config.ts)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:demo
        env:
          # the Mac app is signed ad hoc, with no certificate or secret at all, so a pull request's build may be signed too
          CSC_FOR_PULL_REQUEST: ${{ matrix.name == 'mac' }}
      - if: matrix.name == 'linux'
        run: tar -czf ${{ matrix.out }} -C release linux-unpacked
      - if: matrix.name == 'mac'
        run: |
          ls release/mac-universal
          app=$(ls -d release/mac-universal/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/"*
          ditto -c -k --keepParent "$app" ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: disco-underground-demo-${{ matrix.name }}
          path: ${{ matrix.out }}
          retention-days: 14
